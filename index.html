<title>Cibertodo Quizz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, three screens (inicio, pregunta, resultado).
   Color: azul y rojo de la bandera sobre neutros con matiz azul.
   Type: Alfa Slab One (rótulo de colmado) solo en títulos y puntaje; Figtree para todo lo demás. */
:root {
  --bg: #F2F4FA;
  --surface: #FFFFFF;
  --ink: #0E1B3D;
  --muted: #566282;
  --line: #D6DCEC;
  --blue: #1F3F9E;
  --red: #CE1126;
  --cta: #CE1126;
  --on-cta: #FFFFFF;
  --good: #17784B;
  --goodbg: #DDF2E7;
  --badbg: #FBE0E3;
  --flag-blue: #0B3A8C;
  --flag-red: #CE1126;
  --flag-white: #FFFFFF;
  --display: "Alfa Slab One", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1128;
    --surface: #131C3A;
    --ink: #EDF0FA;
    --muted: #9CA8CA;
    --line: #27335C;
    --blue: #86A3FF;
    --red: #FF6B77;
    --good: #4CD694;
    --goodbg: #123A2C;
    --badbg: #4A1B25;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1128;
  --surface: #131C3A;
  --ink: #EDF0FA;
  --muted: #9CA8CA;
  --line: #27335C;
  --blue: #86A3FF;
  --red: #FF6B77;
  --good: #4CD694;
  --goodbg: #123A2C;
  --badbg: #4A1B25;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
  min-height: 100vh;
}
.wrap { max-width: 520px; margin: 0 auto; }
section[hidden] { display: none !important; }
button { font-family: inherit; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- Inicio ---------- */
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 58px; height: 58px; flex: none; }
.kicker { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(2.2rem, 10vw, 3.1rem); line-height: 1.04;
  margin: 28px 0 0; text-wrap: balance;
}
.rule { display: flex; gap: 6px; margin: 16px 0 18px; }
.rule span { height: 6px; border-radius: 3px; }
.rule span:first-child { width: 56px; background: var(--blue); }
.rule span:last-child { width: 28px; background: var(--red); }
.lead { margin: 0 0 24px; color: var(--muted); font-size: 1.05rem; max-width: 34ch; }
.modes { display: grid; gap: 12px; }
.mode {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 72px; padding: 14px 16px; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--line); border-radius: 16px;
}
.mode .t { display: block; font-weight: 800; font-size: 1.1rem; }
.mode .d { display: block; font-size: .9rem; color: var(--muted); margin-top: 2px; }
.mode .go { flex: none; font-weight: 800; font-size: 1.3rem; color: var(--blue); }
.mode.main { background: var(--cta); border-color: var(--cta); color: var(--on-cta); }
.mode.main .d, .mode.main .go { color: var(--on-cta); }
.mode.main .d { opacity: .9; }
@media (hover: hover) { .mode:not(.main):hover { border-color: var(--blue); } }
.best { margin: 22px 0 0; color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }

/* ---------- Pregunta ---------- */
.hud { display: flex; align-items: center; gap: 12px; }
.count, .score { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score { color: var(--blue); }
.segs { display: flex; gap: 4px; flex: 1; min-width: 0; }
.segs span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.segs .ok { background: var(--good); }
.segs .no { background: var(--red); }
.segs .now { background: var(--blue); }
.timer { height: 8px; margin-top: 14px; border-radius: 4px; background: var(--line); overflow: hidden; }
.timer > div { height: 100%; background: var(--blue); transform-origin: left center; }
.timer.low > div { background: var(--red); }
.chip {
  display: inline-block; margin-top: 22px; padding: 4px 10px; border-radius: 999px;
  font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
  color: var(--blue); border: 1.5px solid var(--blue);
}
.q { font-size: 1.4rem; line-height: 1.28; font-weight: 800; margin: 12px 0 20px; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px;
  padding: 10px 14px; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--line); border-radius: 14px;
  font-size: 1rem; font-weight: 600;
}
.opt .key {
  flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--bg); color: var(--muted); font-size: .85rem; font-weight: 800;
}
.opt .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .mark { flex: none; font-weight: 800; font-size: 1.1rem; }
.opt:disabled { cursor: default; color: var(--ink); }
.opt.correct { border-color: var(--good); background: var(--goodbg); }
.opt.correct .mark { color: var(--good); }
.opt.wrong { border-color: var(--red); background: var(--badbg); }
.opt.wrong .mark { color: var(--red); }
.opt.dim { opacity: .55; }
@media (hover: hover) { .opt:not(:disabled):hover { border-color: var(--blue); } }

.fb { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.fb h3 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 800; }
.fb h3.ok { color: var(--good); }
.fb h3.no { color: var(--red); }
.fb p { margin: 0; color: var(--muted); }
.fb .streak { margin-top: 8px; font-size: .9rem; font-weight: 700; color: var(--blue); }
.cta {
  display: block; width: 100%; min-height: 54px; margin-top: 14px; padding: 12px 16px;
  border: 0; border-radius: 14px; cursor: pointer;
  background: var(--cta); color: var(--on-cta); font-size: 1.05rem; font-weight: 800;
}
.cta.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.cta.share { background: #17784B; }
.cta.ghost { margin-top: 10px; }
.cta[hidden] { display: none; }



/* ---------- Niveles ---------- */
.mode .num {
  flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
  background: var(--bg); color: var(--blue);
  font-family: var(--display); font-size: 1.3rem; line-height: 1;
}
.mode .mid { flex: 1; min-width: 0; }
.mode .go { font-size: .85rem; text-align: right; }
.mode.main .num { background: rgba(255, 255, 255, .22); color: var(--on-cta); }
.mode.locked { opacity: .6; cursor: not-allowed; }
.mode.locked .go { color: var(--muted); }
.end-msg { margin: 10px 0 0; color: var(--muted); }

/* ---------- Resultado ---------- */
.end-rank { font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
.end-title { font-family: var(--display); font-weight: 400; font-size: clamp(1.9rem, 8.5vw, 2.6rem); line-height: 1.08; margin: 8px 0 0; text-wrap: balance; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0 6px; }
.stat { padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .85rem; color: var(--muted); }
.end-best { margin: 14px 0 0; color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
.end-best strong { color: var(--ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script>
(function () {
  "use strict";

  var SECONDS = 20;
  var ROUND = 10;
  var CAT = { dom: "Dominicanidad", gen: "Cultura general", tec: "Tecnología y seguridad" };

    { c: "dom", d: 1, q: "¿Qué día se celebra la Independencia Nacional?",

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function show(id) {
    ["s-start", "s-quiz", "s-end"].forEach(function (x) { $(x).hidden = x !== id; });
    window.scrollTo(0, 0);
  }
  var KEY = "sabelotodo-niveles";
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY));
      if (o && o.best && o.passed && o.unlocked) return o;
    } catch (e) {}
    return { unlocked: 1, best: {}, passed: {} };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
  }
  var P = load();
  if (!P.seen) P.seen = {};

  /* Cuántas preguntas de cada dificultad entran en cada nivel (suman 10).
     Así el nivel sigue subiendo, pero siempre se cuela alguna más fácil o más difícil. */
  var MIX = {
    1: { 1: 8, 2: 2 },
    2: { 1: 2, 2: 6, 3: 2 },
    3: { 2: 2, 3: 6, 4: 2 },
    4: { 3: 3, 4: 7 }
  };

  /* Elige primero preguntas que no se han visto. Cuando se acaban las de una dificultad, vuelve a empezar. */
  function pick(level) {
    var out = [];
    Object.keys(MIX[level.n]).forEach(function (dk) {
      var d = parseInt(dk, 10), want = MIX[level.n][dk];
      var pool = QUESTIONS.filter(function (q) { return q.d === d; });
      var take = shuffle(pool.filter(function (q) { return !P.seen[q.q]; })).slice(0, want);
      if (take.length < want) {
        pool.forEach(function (q) { delete P.seen[q.q]; });
        var rest = shuffle(pool.filter(function (q) { return take.indexOf(q) < 0; }));
        take = take.concat(rest.slice(0, want - take.length));
      }
      take.forEach(function (q) { P.seen[q.q] = 1; });
      out = out.concat(take);
    });
    save();
    return shuffle(out);
  }

      var passed = !!P.passed[l.n];
      if (passed) done += 1;
      var cls = "mode" + (l.n === P.unlocked && !passed ? " main" : "") + (locked ? " locked" : "");
      var b = el("button", cls);
      b.type = "button";
      b.disabled = locked;
      b.appendChild(el("span", "num", String(l.n)));
      var mid = el("span", "mid");
      mid.appendChild(el("span", "t", l.name));
      mid.appendChild(el("span", "d", locked
        ? "Saca " + PASS + "/" + ROUND + " en el nivel " + (l.n - 1) + " para abrirlo"
        : l.desc + " · " + ROUND + " preguntas"));
      b.appendChild(mid);
      var best = P.best[l.n] || 0;
      var st = locked ? "Bloqueado" : passed ? "Superado" : best ? "Mejor " + best.toLocaleString("es-DO") : "\u2192";
      b.appendChild(el("span", "go", st));
      if (!locked) b.addEventListener("click", function () { start(l); });
      box.appendChild(b);
    });
    $("best").textContent = done === LEVELS.length
      ? "Superaste los 4 niveles. ¡Ya eres un Cibertodo!"
      : done ? "Niveles superados: " + done + " de " + LEVELS.length
      : "Todavía no has jugado. ¡Ánimo!";
    show("s-start");
  }

  function start(level) {
    var list = pick(level).map(function (q) {
      return {
        c: q.c, q: q.q, e: q.e,
        opts: shuffle(q.o.map(function (t, k) { return { t: t, ok: k === 0 }; }))
      };
    });
    S = { level: level, list: list, i: 0, score: 0, correct: 0, streak: 0, results: [], locked: false, deadline: 0, passed: false };
    show("s-quiz");
    renderQuestion();
  }

  function renderHud() {
    $("count").textContent = (S.i + 1) + "/" + S.list.length;
    $("score").textContent = S.score.toLocaleString("es-DO") + " pts";
    var segs = $("segs");
    segs.textContent = "";
    S.list.forEach(function (_, k) {
      var s = el("span");
      if (k < S.results.length) s.className = S.results[k] ? "ok" : "no";
      else if (k === S.i) s.className = "now";
      segs.appendChild(s);
    });
  }

  function renderQuestion() {
    var q = S.list[S.i];
    S.locked = false;
    renderHud();
    $("chip").textContent = "Nivel " + S.level.n + " · " + CAT[q.c];
    $("q").textContent = q.q;
    $("fbBox").textContent = "";
    var box = $("opts");
    box.textContent = "";
    q.opts.forEach(function (o, k) {
      var b = el("button", "opt");
      b.type = "button";
      b.appendChild(el("span", "key", String.fromCharCode(65 + k)));
      b.appendChild(el("span", "txt", o.t));
      b.appendChild(el("span", "mark", ""));
      b.addEventListener("click", function () { answer(k); });
      box.appendChild(b);
    });
    startTimer();
  }

  function startTimer() {
    clearInterval(tick);
    var bar = $("timerBar");
    $("timer").classList.remove("low");
    bar.style.transform = "scaleX(1)";
    S.deadline = performance.now() + SECONDS * 1000;
    tick = setInterval(function () {
      var left = Math.max(0, (S.deadline - performance.now()) / 1000);
      bar.style.transform = "scaleX(" + (left / SECONDS) + ")";
      if (left <= 5) $("timer").classList.add("low");
      if (left <= 0) answer(-1);
    }, 100);
  }

  function answer(idx) {
    if (S.locked) return;
    S.locked = true;
    clearInterval(tick);
    var left = Math.max(0, (S.deadline - performance.now()) / 1000);
    var q = S.list[S.i];
    var ok = idx >= 0 && q.opts[idx].ok;
    var pts = 0;
    if (ok) {
      pts = Math.max(10, Math.round((left / SECONDS) * 200)) * S.level.n;
      S.score += pts;
      S.correct += 1;
      S.streak += 1;
    } else {
      S.streak = 0;
    }
    S.results.push(ok);

    var buttons = $("opts").children;
    for (var k = 0; k < buttons.length; k++) {
      var b = buttons[k];
      b.disabled = true;
      var mark = b.querySelector(".mark");
      if (q.opts[k].ok) { b.classList.add("correct"); mark.textContent = "✓"; }
      else if (k === idx) { b.classList.add("wrong"); mark.textContent = "✗"; }
      else b.classList.add("dim");
    }
    renderHud();

    var fb = el("div", "fb");
    fb.setAttribute("role", "status");
    var head = idx < 0 ? "Se acabó el tiempo" : ok ? "¡Correcto! +" + pts : "Incorrecto";
    fb.appendChild(el("h3", ok ? "ok" : "no", head));
    fb.appendChild(el("p", "", q.e));
    if (S.streak >= 2) fb.appendChild(el("div", "streak", "Racha de " + S.streak + " seguidas"));
    var last = S.i === S.list.length - 1;
    var next = el("button", "cta", last ? "Ver resultado" : "Siguiente");
    next.type = "button";
    next.addEventListener("click", function () {
      if (last) finish(); else { S.i += 1; renderQuestion(); }
    });
    $("fbBox").textContent = "";
    $("fbBox").appendChild(fb);
    $("fbBox").appendChild(next);
    next.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function finish() {
    var L = S.level;
    var passed = S.correct >= PASS;
    var last = L.n === LEVELS.length;
    S.passed = passed;
    var prev = P.best[L.n] || 0;
    var record = S.score > prev;
    if (record) P.best[L.n] = S.score;
    if (passed) {
      P.passed[L.n] = true;
      if (!last && P.unlocked < L.n + 1) P.unlocked = L.n + 1;
    }
    save();

    $("endRank").textContent = "Nivel " + L.n + " · " + L.name;
    $("endTitle").textContent = passed
      ? (last ? "¡Eres un Cibertodo de Quisqueya!" : "¡Pasaste al nivel " + (L.n + 1) + "!")
      : "Casi lo logras";
    $("endMsg").textContent = passed
      ? (last ? "Completaste los 4 niveles. Reta a tus panas a superarte."
              : "Ya puedes jugar el nivel " + (L.n + 1) + ": " + LEVELS[L.n].name + ".")
      : "Necesitas " + PASS + " de " + S.list.length + " para pasar. Tú sacaste " + S.correct + ".";
    $("endScore").textContent = S.score.toLocaleString("es-DO");
    $("endOk").textContent = S.correct + "/" + S.list.length;
    $("endBest").textContent = "";
    if (record && S.score > 0) {
      $("endBest").appendChild(el("strong", "", "¡Nuevo récord en este nivel!"));
      if (prev) $("endBest").appendChild(document.createTextNode(" Antes tu mejor era " + prev.toLocaleString("es-DO") + "."));
    } else {
      $("endBest").appendChild(document.createTextNode("Tu mejor en este nivel: "));
      $("endBest").appendChild(el("strong", "", Math.max(prev, S.score).toLocaleString("es-DO")));
    }
    $("nextLvl").hidden = !(passed && !last);
    $("again").classList.toggle("ghost", passed);
    show("s-end");
  }

  $("nextLvl").addEventListener("click", function () { start(LEVELS[S.level.n]); });
  $("again").addEventListener("click", function () { start(S.level); });
  $("menu").addEventListener("click", buildMenu);

  $("share").addEventListener("click", function () {
    var url = location.href.split("#")[0];
    var L = S.level;
    var txt = (S.passed ? "Pasé el nivel " + L.n + " (" + L.name + ")" : "Saqué " + S.correct + "/" + S.list.length + " en el nivel " + L.n + " (" + L.name + ")") +
      " de Cibertodo Quizz con " + S.score.toLocaleString("es-DO") + " puntos. ¿Me ganas? " + url;
    if (navigator.share) {
      navigator.share({ title: "Cibertodo Quizz", text: txt }).catch(function () {});
    } else {
      window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
    }
  });

  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    $("install").hidden = false;
  });
  $("install").addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; $("install").hidden = true; });
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  buildMenu();
})();
</script>

</body></html>
